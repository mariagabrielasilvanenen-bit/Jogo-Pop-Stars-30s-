<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Desafio dos Pop Stars 🌟 Mini-Game 30s</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background: linear-gradient(135deg, #6EE7B7 0%, #3B82F6 50%, #9333EA 100%);
            overflow: hidden;
        }

        .font-game {
            font-family: 'Fredoka One', cursive;
        }

        /* Target Popup Animations */
        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.15) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .target-item {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            touch-action: manipulation;
        }

        .target-inner {
            animation: floatAnim 1.5s ease-in-out infinite;
        }

        /* Floating text indicator (+1, +3, Combo) */
        @keyframes scoreFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.4); }
        }

        .floating-score {
            position: absolute;
            pointer-events: none;
            animation: scoreFloat 0.8s ease-out forwards;
            font-family: 'Fredoka One', cursive;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            z-index: 40;
        }

        /* Pulsing start button */
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 230, 0, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 230, 0, 0.9); }
        }

        .btn-pulse {
            animation: pulseGlow 1.8s infinite ease-in-out;
        }

        /* Custom Bounce effect for HUD items */
        .hud-bounce {
            transition: transform 0.1s ease;
        }
        .hud-bounce.active {
            transform: scale(1.25);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-4 relative select-none">

    <!-- TOP HUD (Placar, Tempo e Combo) -->
    <header class="w-full max-w-md bg-white/20 backdrop-blur-md border-2 border-white/40 rounded-3xl p-3 flex justify-between items-center shadow-lg z-20">
        <!-- PONTUAÇÃO -->
        <div class="flex items-center gap-2 bg-yellow-400 border-2 border-yellow-200 px-3 py-1.5 rounded-2xl shadow-inner">
            <span class="text-2xl">⭐</span>
            <div>
                <p class="text-[10px] uppercase font-black text-yellow-900 leading-none">Pontos</p>
                <p id="scoreText" class="font-game text-2xl text-yellow-950 leading-none hud-bounce">0</p>
            </div>
        </div>

        <!-- COMBO MULTIPLIER -->
        <div id="comboContainer" class="opacity-0 transition-opacity duration-200 flex flex-col items-center">
            <span id="comboText" class="font-game text-xl text-pink-300 drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)]">x2 COMBO!</span>
        </div>

        <!-- RECURSO/TEMPO -->
        <div class="flex items-center gap-2 bg-red-500 border-2 border-red-300 px-3 py-1.5 rounded-2xl shadow-inner">
            <span class="text-2xl">⏱️</span>
            <div>
                <p class="text-[10px] uppercase font-black text-red-100 leading-none">Tempo</p>
                <p id="timerText" class="font-game text-2xl text-white leading-none">30s</p>
            </div>
        </div>
    </header>

    <!-- BARRA DE PROGRESSO DO TEMPO -->
    <div class="w-full max-w-md bg-black/20 h-3 rounded-full overflow-hidden my-2 border border-white/30 z-20">
        <div id="timerBar" class="bg-gradient-to-r from-green-400 via-yellow-400 to-red-500 h-full w-full transition-all duration-200"></div>
    </div>

    <!-- ÁREA PRINCIPAL DO JOGO (ONDE OS ALVOS APARECEM) -->
    <main id="gameArea" class="relative w-full max-w-md flex-1 bg-white/10 backdrop-blur-sm border-2 border-white/20 rounded-3xl overflow-hidden shadow-2xl my-2">
        <!-- O conteúdo será gerado dinamicamente pelo JavaScript -->
    </main>

    <!-- TELA INICIAL / SOBREPOSIÇÃO -->
    <div id="startOverlay" class="absolute inset-0 bg-black/60 backdrop-blur-md flex flex-col justify-center items-center p-6 z-50">
        <div class="bg-white border-4 border-yellow-400 rounded-3xl p-6 text-center max-w-xs shadow-2xl flex flex-col items-center transform transition-transform">
            <div class="text-6xl mb-2 animate-bounce">🎯</div>
            <h1 class="font-game text-3xl text-purple-700 leading-tight mb-2">Pop Stars 30s!</h1>
            <p class="text-gray-600 font-bold text-sm mb-4">Toque no máximo de alvos que conseguir antes que o tempo acabe!</p>
            
            <!-- Recorde Atual -->
            <div class="bg-purple-100 border border-purple-300 rounded-xl px-4 py-2 mb-6 w-full">
                <p class="text-xs text-purple-600 font-extrabold uppercase">Seu Recorde</p>
                <p id="highScoreStart" class="font-game text-2xl text-purple-900">0 Pontos</p>
            </div>

            <button id="startBtn" class="btn-pulse font-game text-2xl bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-300 hover:to-orange-400 text-white px-8 py-4 rounded-2xl border-b-4 border-orange-700 active:border-b-0 active:translate-y-1 transition-all w-full shadow-lg">
                JOGAR AGORA! 🚀
            </button>
        </div>
    </div>

    <!-- MODAL DE FIM DE JOGO -->
    <div id="endModal" class="hidden absolute inset-0 bg-black/75 backdrop-blur-md flex flex-col justify-center items-center p-6 z-50">
        <div class="bg-white border-4 border-purple-400 rounded-3xl p-6 text-center max-w-xs shadow-2xl flex flex-col items-center w-full animate-pop">
            
            <h2 class="font-game text-3xl text-purple-800 mb-1">Fim de Jogo!</h2>
            <p id="resultSubtitle" class="text-gray-500 font-bold text-xs mb-3">Excelente tentativa!</p>

            <!-- Estrelas conquistadas -->
            <div class="flex justify-center gap-2 text-4xl mb-4">
                <span id="star1" class="opacity-30 transition-all duration-300">⭐</span>
                <span id="star2" class="opacity-30 transition-all duration-300">⭐</span>
                <span id="star3" class="opacity-30 transition-all duration-300">⭐</span>
            </div>

            <!-- Placar final -->
            <div class="bg-yellow-50 border-2 border-yellow-300 rounded-2xl p-3 w-full mb-4">
                <p class="text-xs text-yellow-700 font-black uppercase">Pontuação Final</p>
                <p id="finalScore" class="font-game text-4xl text-yellow-900 my-1">0</p>
                <p id="newRecordBadge" class="hidden text-xs bg-red-500 text-white font-black px-2 py-0.5 rounded-full inline-block animate-pulse">NOVO RECORDE! 🎉</p>
            </div>

            <!-- Botões de Ação -->
            <div class="flex flex-col gap-2 w-full">
                <button id="restartBtn" class="font-game text-xl bg-gradient-to-r from-green-400 to-emerald-500 text-white py-3 rounded-2xl border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1 shadow-md w-full">
                    Jogar Novamente 🔄
                </button>
                <button id="shareBtn" class="font-game text-base bg-blue-500 hover:bg-blue-600 text-white py-2.5 rounded-2xl border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 shadow-md w-full flex items-center justify-center gap-2">
                    <span>Desafiar Amigos 📲</span>
                </button>
            </div>
            
            <!-- Mensagem de confirmação de cópia -->
            <p id="toastMsg" class="hidden text-xs font-bold text-emerald-600 mt-2">Link de desafio copiado!</p>
        </div>
    </div>

    <!-- MENSAGEM FLUTUANTE DE AVISO (TOAST) -->
    <div id="toastNotification" class="fixed top-20 bg-slate-900/90 text-white font-bold text-xs px-4 py-2 rounded-full shadow-lg pointer-events-none transition-all duration-300 opacity-0 transform -translate-y-4 z-50">
        Mensagem
    </div>

    <script>
        /* ===================================================================
           EFEITOS SONOROS COM SINTETIZADOR WEB AUDIO API (Nenhum áudio externo)
           =================================================================== */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'hit') {
                // Som alegre de acerto (frequência sobe rápido)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'bonus') {
                // Som especial brilhante
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'combo') {
                // Acorde de combo
                osc.type = 'square';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.05); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.1); // G5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'gameover') {
                // Som de fim de jogo
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(150, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        /* ===================================================================
           CONFIGURAÇÕES E ESTADO DO JOGO
           =================================================================== */
        const GAME_DURATION = 30; // Duração total em segundos
        let score = 0;
        let timeLeft = GAME_DURATION;
        let comboCount = 0;
        let gameInterval = null;
        let spawnTimeout = null;
        let isPlaying = false;
        let highScore = parseInt(localStorage.getItem('popstars_highscore') || '0');

        // Tipos de alvos divertidos
        const TARGET_TYPES = [
            { emoji: '⭐', pts: 1, type: 'normal', bg: 'bg-yellow-400', border: 'border-yellow-200', size: 'w-16 h-16 text-3xl' },
            { emoji: '👾', pts: 1, type: 'normal', bg: 'bg-purple-500', border: 'border-purple-300', size: 'w-16 h-16 text-3xl' },
            { emoji: '💎', pts: 3, type: 'bonus', bg: 'bg-cyan-400', border: 'border-cyan-100', size: 'w-14 h-14 text-2xl' },
            { emoji: '🦄', pts: 5, type: 'super', bg: 'bg-pink-400', border: 'border-pink-200', size: 'w-12 h-12 text-2xl' },
            { emoji: '💣', pts: -2, type: 'bomb', bg: 'bg-red-600', border: 'border-red-300', size: 'w-16 h-16 text-3xl' },
            { emoji: '⏰', pts: 0, timeBonus: 3, type: 'time', bg: 'bg-green-500', border: 'border-green-200', size: 'w-14 h-14 text-2xl' }
        ];

        /* DOM Elements */
        const gameArea = document.getElementById('gameArea');
        const scoreText = document.getElementById('scoreText');
        const timerText = document.getElementById('timerText');
        const timerBar = document.getElementById('timerBar');
        const comboContainer = document.getElementById('comboContainer');
        const comboText = document.getElementById('comboText');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');
        const endModal = document.getElementById('endModal');
        const finalScore = document.getElementById('finalScore');
        const highScoreStart = document.getElementById('highScoreStart');
        const newRecordBadge = document.getElementById('newRecordBadge');
        const restartBtn = document.getElementById('restartBtn');
        const shareBtn = document.getElementById('shareBtn');
        const star1 = document.getElementById('star1');
        const star2 = document.getElementById('star2');
        const star3 = document.getElementById('star3');

        // Atualiza a tela inicial com o recorde
        highScoreStart.textContent = `${highScore} Pontos`;

        /* ===================================================================
           LÓGICA PRINCIPAL DO JOGO
           =================================================================== */
        
        function startGame() {
            initAudio();
            score = 0;
            timeLeft = GAME_DURATION;
            comboCount = 0;
            isPlaying = true;

            scoreText.textContent = '0';
            timerText.textContent = `${timeLeft}s`;
            timerBar.style.width = '100%';
            
            startOverlay.classList.add('hidden');
            endModal.classList.add('hidden');
            gameArea.innerHTML = '';

            // Timer do Jogo (A cada segundo)
            gameInterval = setInterval(() => {
                timeLeft--;
                timerText.textContent = `${timeLeft}s`;
                
                // Atualiza barra de progresso
                const percentage = (timeLeft / GAME_DURATION) * 100;
                timerBar.style.width = `${Math.max(0, percentage)}%`;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Inicia geração contínua de alvos
            spawnLoop();
        }

        function spawnLoop() {
            if (!isPlaying) return;

            spawnTarget();

            // A velocidade de surgimento aumenta conforme o tempo passa
            const speedFactor = Math.max(300, 800 - (GAME_DURATION - timeLeft) * 15);
            spawnTimeout = setTimeout(spawnLoop, speedFactor);
        }

        function spawnTarget() {
            if (!isPlaying) return;

            // Escolhe um tipo de alvo baseado em probabilidades
            const rand = Math.random();
            let targetConfig;

            if (rand < 0.55) targetConfig = TARGET_TYPES[0]; // Estrela
            else if (rand < 0.75) targetConfig = TARGET_TYPES[1]; // Monstrinho
            else if (rand < 0.85) targetConfig = TARGET_TYPES[2]; // Gema (+3)
            else if (rand < 0.92) targetConfig = TARGET_TYPES[3]; // Unicórnio (+5)
            else if (rand < 0.97) targetConfig = TARGET_TYPES[4]; // Bomba (-2)
            else targetConfig = TARGET_TYPES[5]; // Relógio (+3s)

            // Criar elemento HTML do alvo
            const target = document.createElement('div');
            target.className = `target-item absolute flex items-center justify-center ${targetConfig.size} ${targetConfig.bg} border-4 ${targetConfig.border} rounded-full shadow-lg cursor-pointer active:scale-95 transition-transform`;

            // Posição aleatória na área visível
            const maxX = gameArea.clientWidth - 70;
            const maxY = gameArea.clientHeight - 70;
            const posX = Math.max(10, Math.floor(Math.random() * maxX));
            const posY = Math.max(10, Math.floor(Math.random() * maxY));

            target.style.left = `${posX}px`;
            target.style.top = `${posY}px`;

            // Conteúdo interno do alvo com efeito de flutuação
            target.innerHTML = `<span class="target-inner select-none pointer-events-none">${targetConfig.emoji}</span>`;

            // Evento ao clicar/tocar no alvo
            const handleHit = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!isPlaying) return;

                handleTargetClick(targetConfig, posX, posY);
                target.remove();
            };

            target.addEventListener('touchstart', handleHit, { passive: false });
            target.addEventListener('mousedown', handleHit);

            gameArea.appendChild(target);

            // O alvo desaparece automaticamente após um tempo curto se não for clicado
            const lifespan = targetConfig.type === 'super' ? 1200 : 1800;
            setTimeout(() => {
                if (target.parentNode) {
                    target.remove();
                    // Quebra de combo se perder um alvo positivo
                    if (targetConfig.pts > 0) {
                        resetCombo();
                    }
                }
            }, lifespan);
        }

        function handleTargetClick(config, x, y) {
            let ptsGained = config.pts;

            if (config.type === 'bomb') {
                // Clicou na bomba
                playSound('gameover');
                resetCombo();
                showFloatingScore(x, y, `${ptsGained}`, 'text-red-500');
            } else if (config.type === 'time') {
                // Adiciona tempo extra
                timeLeft += config.timeBonus;
                timerText.textContent = `${timeLeft}s`;
                playSound('bonus');
                showFloatingScore(x, y, `+${config.timeBonus}s!`, 'text-green-400');
            } else {
                // Acerto normal ou bônus
                comboCount++;
                let multiplier = 1;

                if (comboCount >= 10) multiplier = 3;
                else if (comboCount >= 5) multiplier = 2;

                ptsGained *= multiplier;
                score += ptsGained;

                // Efeito sonoro
                if (multiplier > 1) playSound('combo');
                else if (config.pts > 1) playSound('bonus');
                else playSound('hit');

                // Animação no HUD do placar
                scoreText.textContent = score;
                scoreText.classList.add('active');
                setTimeout(() => scoreText.classList.remove('active'), 100);

                // Indicador visual na tela
                const comboMsg = multiplier > 1 ? ` +${ptsGained} (x${multiplier})` : `+${ptsGained}`;
                showFloatingScore(x, y, comboMsg, multiplier > 1 ? 'text-yellow-300' : 'text-white');

                // Atualizar indicador de Combo
                if (comboCount >= 5) {
                    comboContainer.classList.remove('opacity-0');
                    comboText.textContent = `x${multiplier} COMBO! 🔥`;
                }
            }
        }

        function resetCombo() {
            comboCount = 0;
            comboContainer.classList.add('opacity-0');
        }

        // Mostra texto flutuante (+1, +3, Combo) no local do toque
        function showFloatingScore(x, y, text, colorClass) {
            const floatEl = document.createElement('div');
            floatEl.className = `floating-score text-2xl ${colorClass}`;
            floatEl.style.left = `${x + 10}px`;
            floatEl.style.top = `${y - 10}px`;
            floatEl.textContent = text;

            gameArea.appendChild(floatEl);

            setTimeout(() => floatEl.remove(), 800);
        }

        /* ===================================================================
           FIM DE JOGO E RECOMPENSAS
           =================================================================== */
        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearTimeout(spawnTimeout);
            gameArea.innerHTML = '';

            playSound('gameover');

            // Atualiza recorde
            let isNewRecord = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('popstars_highscore', highScore.toString());
                isNewRecord = true;
            }

            finalScore.textContent = score;
            highScoreStart.textContent = `${highScore} Pontos`;

            // Exibe badge de novo recorde
            if (isNewRecord && score > 0) {
                newRecordBadge.classList.remove('hidden');
                // Solta confetes para comemorar o recorde!
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } else {
                newRecordBadge.classList.add('hidden');
            }

            // Calcular estrelas (exemplo de corte: 15, 30, 50 pontos)
            star1.style.opacity = score >= 15 ? '1' : '0.2';
            star1.style.transform = score >= 15 ? 'scale(1.2)' : 'scale(1)';
            
            star2.style.opacity = score >= 30 ? '1' : '0.2';
            star2.style.transform = score >= 30 ? 'scale(1.2)' : 'scale(1)';

            star3.style.opacity = score >= 50 ? '1' : '0.2';
            star3.style.transform = score >= 50 ? 'scale(1.2)' : 'scale(1)';

            // Mensagem personalizada
            const subtitle = document.getElementById('resultSubtitle');
            if (score >= 50) subtitle.textContent = 'Mestre dos Pop Stars! 🏆';
            else if (score >= 30) subtitle.textContent = 'Incrível! Super Rápido! ⚡';
            else if (score >= 15) subtitle.textContent = 'Muito Bom! Continue assim! 👍';
            else subtitle.textContent = 'Tente Novamente para treinar! 💪';

            // Abre o modal final
            endModal.classList.remove('hidden');
        }

        /* ===================================================================
           COMPARTILHAMENTO & BOTÕES
           =================================================================== */
        function copyChallengeText() {
            const shareText = `⭐ Fiz ${score} pontos no Desafio dos Pop Stars em 30 segundos! Você consegue me vencer? 🚀\nJogue agora!`;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(shareText).then(showToast);
            } else {
                // Fallback para navegadores sem suporte a clipboard
                const textArea = document.createElement('textarea');
                textArea.value = shareText;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Erro ao copiar', err);
                }
                document.body.removeChild(textArea);
            }
        }

        function showToast() {
            const toast = document.getElementById('toastNotification');
            toast.textContent = 'Desafio copiado! Cole no WhatsApp! 📲';
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 2500);
        }

        /* Listeners */
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        shareBtn.addEventListener('click', copyChallengeText);

    </script>
</body>
</html>
